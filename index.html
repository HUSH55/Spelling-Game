<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a1a">
<title>Dark Overlord: Monster Empire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:Georgia,serif;color:#e8d4b0}
:root{
  --bg:#0a0a1a;--panel:#0d0d22;--border:#2d1b69;--accent:#7b00ee;
  --gold:#ffd700;--red:#ff3333;--green:#33cc66;--text:#e8d4b0;--muted:#7a6a90;
  --nav:60px;--hdr:54px;--safe:env(safe-area-inset-bottom,0px)
}
#app{width:100%;height:100%;position:relative;overflow:hidden}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .25s}
.screen.active{opacity:1;pointer-events:all}

/* AUTH */
#auth{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a0a3e 0%,#0a0a1a 70%)}
#auth-bg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.auth-box{position:relative;z-index:1;width:90%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px}
.auth-title{font-size:2.2rem;font-weight:bold;color:var(--gold);text-shadow:0 0 20px #ffd70088,0 0 40px #ffd70044;letter-spacing:3px;animation:glow 2s ease-in-out infinite alternate;text-align:center}
.auth-sub{color:var(--muted);font-size:.9rem;letter-spacing:6px;text-transform:uppercase;margin-top:-8px}
@keyframes glow{from{text-shadow:0 0 10px #ffd70066}to{text-shadow:0 0 30px #ffd700cc,0 0 60px #ffd70055}}
.auth-input{width:100%;padding:13px 16px;background:#0f0f2a;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;outline:none;-webkit-user-select:text;user-select:text}
.auth-input:focus{border-color:var(--accent);box-shadow:0 0 10px #7b00ee44}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:1rem;font-family:Georgia,serif;cursor:pointer;transition:all .2s;letter-spacing:1px}
.btn-primary{background:linear-gradient(135deg,#4a1a8a,#7b00ee);color:#fff;box-shadow:0 0 15px #7b00ee44}
.btn-primary:active{transform:scale(.97);box-shadow:0 0 25px #7b00ee88}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid #2d1b6966;font-size:.85rem}
.auth-err{color:var(--red);font-size:.85rem;text-align:center;min-height:18px}

/* TOP BAR */
#topbar{height:var(--hdr);background:#0d0d22;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;padding-top:env(safe-area-inset-top,0px)}
.tb-name{font-size:.85rem;color:var(--gold);font-weight:bold;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-level{background:#1a0a3e;border:1px solid var(--accent);border-radius:12px;padding:2px 8px;font-size:.75rem;color:#cc88ff;white-space:nowrap}
.tb-hp{flex:1;height:16px;background:#1a0a0a;border-radius:8px;overflow:hidden;position:relative;border:1px solid #3a0a0a}
.tb-hp-fill{height:100%;background:linear-gradient(90deg,#cc0000,#ff3333);transition:width .3s}
.tb-hp-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#fff;font-weight:bold}
.tb-gold{color:var(--gold);font-size:.85rem;white-space:nowrap;display:flex;align-items:center;gap:3px}
.tb-energy{width:50px;height:8px;background:#0a0a2a;border-radius:4px;overflow:hidden;border:1px solid #2200aa}
.tb-energy-fill{height:100%;background:linear-gradient(90deg,#4400cc,#8b00ff);transition:width .5s}

/* NAV BAR */
#navbar{height:calc(var(--nav) + var(--safe));background:#0d0d22;border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:var(--safe)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--muted);font-size:.6rem;cursor:pointer;padding:8px 0;transition:color .2s;letter-spacing:.5px}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:1.3rem;line-height:1}

/* WORLD SCREEN */
#world{padding-top:0}
.world-scroll{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:20px}
.world-scroll::-webkit-scrollbar{display:none}
.zone-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s}
.zone-card:active{transform:scale(.97)}
.zone-card.locked{opacity:.45;cursor:default}
.zone-header{height:70px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.zone-name{position:relative;z-index:1;font-size:.8rem;font-weight:bold;color:#fff;text-shadow:0 1px 4px #000;text-align:center;padding:4px}
.zone-body{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.zone-progress{height:8px;background:#1a0a0a;border-radius:4px;overflow:hidden;border:1px solid #2a0a0a}
.zone-progress-fill{height:100%;background:linear-gradient(90deg,#aa0000,#ff3333);transition:width .5s}
.zone-kills{font-size:.65rem;color:var(--muted);display:flex;justify-content:space-between}
.zone-btns{display:flex;gap:6px}
.zone-enter{flex:1;padding:7px;background:#2d1b69;border:none;border-radius:6px;color:#fff;font-size:.75rem;cursor:pointer;font-family:Georgia,serif}
.zone-boss{flex:1;padding:7px;background:#6a0000;border:1px solid #ff3333;border-radius:6px;color:#ff8888;font-size:.75rem;cursor:pointer;font-family:Georgia,serif;animation:bossPulse 2s infinite}
@keyframes bossPulse{0%,100%{box-shadow:0 0 5px #ff000033}50%{box-shadow:0 0 15px #ff000088}}
.zone-assigned{font-size:.65rem;color:#8888cc}
.zone-locked-msg{text-align:center;padding:8px;font-size:.7rem;color:var(--muted)}
.idle-bar{background:#0d0d22;border-bottom:1px solid var(--border);padding:6px 12px;font-size:.75rem;color:var(--gold);display:flex;justify-content:space-between;flex-shrink:0}

/* BATTLE SCREEN */
#battle{background:#000}
#battle-canvas{width:100%;flex:1;display:block}
.battle-log{background:#0a0a18;border-top:1px solid var(--border);padding:8px 12px;height:76px;overflow-y:auto;flex-shrink:0}
.battle-log::-webkit-scrollbar{display:none}
.battle-log p{font-size:.75rem;color:#b0a0c0;line-height:1.5;padding:1px 0}
.battle-log p.hit{color:#ff9999}
.battle-log p.player{color:#cc88ff}
.battle-log p.convert{color:#ff00ff;font-weight:bold}
.battle-log p.good{color:#88ff88}
.battle-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;flex-shrink:0;background:#0d0d22;border-top:1px solid var(--border)}
.battle-btn{padding:14px 8px;border-radius:8px;font-size:.85rem;font-family:Georgia,serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;border:1px solid transparent}
.battle-btn:active{transform:scale(.95)}
.btn-attack{background:#1a0a3e;color:#cc88ff;border-color:#4a2a8a}
.btn-magic{background:#0a1a3a;color:#88aaff;border-color:#2a4a8a}
.btn-convert{background:#2a0a4a;color:#ff88ff;border-color:#8800cc;opacity:.4}
.btn-convert.ready{opacity:1;animation:convertGlow 1.5s infinite alternate}
@keyframes convertGlow{from{box-shadow:0 0 8px #8800cc44}to{box-shadow:0 0 20px #cc00ff}}
.btn-flee{background:#1a0a0a;color:#ff8888;border-color:#4a1a1a}
.battle-btn:disabled{opacity:.35;pointer-events:none}

/* ARMY SCREEN */
#army{overflow:hidden}
.army-header{background:#0d0d22;border-bottom:1px solid var(--border);padding:10px 12px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.army-stats-txt{font-size:.75rem;color:var(--muted)}
.army-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.army-list::-webkit-scrollbar{display:none}
.monster-card{background:var(--panel);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.monster-card.rarity-uncommon{border-color:#22aa44}
.monster-card.rarity-rare{border-color:#2244cc}
.monster-card.rarity-epic{border-color:#8800cc}
.monster-card.rarity-legendary{border-color:#ff8800}
.mc-top{display:flex;align-items:center;gap:10px;padding:10px}
.mc-sprite{width:48px;height:48px;flex-shrink:0;border-radius:6px;background:#0a0a1a;overflow:hidden}
.mc-info{flex:1;min-width:0}
.mc-name{font-size:.85rem;color:var(--text);font-weight:bold}
.mc-type{font-size:.7rem;color:var(--muted)}
.mc-lvl{font-size:.7rem;color:#cc88ff;background:#1a0a3e;border-radius:10px;padding:1px 6px;display:inline-block}
.mc-xpbar{height:4px;background:#1a1a2a;border-radius:2px;overflow:hidden;margin-top:4px}
.mc-xpbar-fill{height:100%;background:#7b00ee;transition:width .5s}
.mc-bottom{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}
.mc-assign-btn{flex:1;padding:6px;background:#1a0a3e;border:1px solid var(--accent);border-radius:6px;color:#cc88ff;font-size:.7rem;cursor:pointer;font-family:Georgia,serif;text-align:center;min-width:80px}
.mc-equip-btn{padding:6px 10px;background:#1a1a0a;border:1px solid #664400;border-radius:6px;color:#cc9922;font-size:.7rem;cursor:pointer;font-family:Georgia,serif}
.mc-zone-tag{padding:3px 8px;background:#0a1a0a;border:1px solid #224422;border-radius:12px;color:#44cc66;font-size:.65rem;display:flex;align-items:center}
.evo-badge{padding:3px 8px;background:#2a0a4a;border:1px solid #8800cc;border-radius:12px;color:#ff88ff;font-size:.65rem;animation:convertGlow 1s infinite alternate;cursor:pointer;display:flex;align-items:center}
.empty-army{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:.9rem;text-align:center;padding:20px}

/* INVENTORY */
#inventory{overflow:hidden}
.inv-tabs{display:flex;background:#0d0d22;border-bottom:1px solid var(--border);flex-shrink:0}
.inv-tab{flex:1;padding:10px 4px;text-align:center;font-size:.72rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.inv-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.inv-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:20px;align-content:start}
.inv-grid::-webkit-scrollbar{display:none}
.item-card{background:var(--panel);border-radius:8px;padding:10px;border:1px solid #333355;cursor:pointer;transition:transform .15s}
.item-card:active{transform:scale(.96)}
.item-card.uncommon{border-color:#22aa44}
.item-card.rare{border-color:#2244cc}
.item-card.epic{border-color:#8800cc}
.item-card.legendary{border-color:#ff8800}
.item-icon{font-size:1.6rem;text-align:center;margin-bottom:4px}
.item-name{font-size:.72rem;font-weight:bold;color:var(--text);text-align:center;margin-bottom:3px}
.item-stats{font-size:.62rem;color:var(--muted);text-align:center}
.item-rarity{font-size:.6rem;text-align:center;margin-top:2px}
.item-rarity.common{color:#888}
.item-rarity.uncommon{color:#22aa44}
.item-rarity.rare{color:#4466ff}
.item-rarity.epic{color:#aa22ff}
.item-rarity.legendary{color:#ff8800}
.inv-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--muted);font-size:.85rem}
.inv-gold-bar{background:#0d0d22;border-bottom:1px solid var(--border);padding:8px 12px;font-size:.8rem;color:var(--gold);flex-shrink:0}

/* RANKINGS */
#rankings{overflow:hidden}
.rank-tabs{display:flex;background:#0d0d22;border-bottom:1px solid var(--border);flex-shrink:0}
.rank-tab{flex:1;padding:10px;text-align:center;font-size:.75rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.rank-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.rank-list{flex:1;overflow-y:auto;padding-bottom:20px}
.rank-list::-webkit-scrollbar{display:none}
.rank-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #1a1a2a;gap:10px}
.rank-row.me{background:#1a0a3e44;border-left:3px solid var(--accent)}
.rank-num{width:28px;text-align:center;font-size:.85rem;color:var(--muted);flex-shrink:0}
.rank-num.gold-r{color:#ffd700;font-weight:bold}
.rank-num.silver-r{color:#cccccc;font-weight:bold}
.rank-num.bronze-r{color:#cd7f32;font-weight:bold}
.rank-name{flex:1;font-size:.82rem;color:var(--text)}
.rank-val{font-size:.78rem;color:var(--accent)}
.rank-refresh{margin:8px 12px;padding:10px;background:#0d0d22;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.8rem;cursor:pointer;font-family:Georgia,serif;width:calc(100% - 24px)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:#00000099;z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#0d0d22;border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:20px;padding-bottom:calc(20px + var(--safe));max-height:70vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:1rem;color:var(--gold);text-align:center;margin-bottom:16px;font-weight:bold}
.evo-options{display:flex;flex-direction:column;gap:10px}
.evo-opt{background:#1a0a3e;border:1px solid var(--accent);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s}
.evo-opt:active{transform:scale(.97);background:#2d1b69}
.evo-opt-name{font-size:.9rem;color:#cc88ff;font-weight:bold;margin-bottom:4px}
.evo-opt-desc{font-size:.75rem;color:var(--muted)}
.evo-opt-stats{font-size:.72rem;color:var(--green);margin-top:4px}
.assign-zones{display:flex;flex-direction:column;gap:8px}
.assign-zone-row{background:#0a0a1a;border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:.82rem}
.assign-zone-row:active{background:#1a0a3e}
.gains-popup{text-align:center}
.gains-title{color:var(--gold);font-size:1rem;margin-bottom:12px}
.gains-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;text-align:left}
.gains-row{display:flex;justify-content:space-between;font-size:.82rem}
.gains-row span:last-child{color:var(--gold)}

/* TOAST */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1a0a3e;border:1px solid var(--accent);border-radius:8px;padding:10px 18px;font-size:.82rem;color:#cc88ff;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* LOADING */
#loading{align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse,#1a0a3e,#0a0a1a)}
.loading-title{font-size:2rem;color:var(--gold);text-shadow:0 0 20px #ffd70088;letter-spacing:3px}
.loading-sub{color:var(--muted);font-size:.8rem;letter-spacing:4px}
.loading-ring{width:50px;height:50px;border:3px solid #2d1b69;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">

<!-- LOADING -->
<div id="loading" class="screen active">
  <div class="loading-title">DARK OVERLORD</div>
  <div class="loading-sub">MONSTER EMPIRE</div>
  <div class="loading-ring"></div>
</div>

<!-- AUTH -->
<div id="auth" class="screen">
  <canvas id="auth-bg"></canvas>
  <div class="auth-box">
    <div style="margin-bottom:8px;text-align:center">
      <div class="auth-title">DARK OVERLORD</div>
      <div class="auth-sub">Monster Empire</div>
    </div>
    <input class="auth-input" id="auth-name" placeholder="Overlord Name" style="display:none" autocomplete="off">
    <input class="auth-input" id="auth-email" type="email" placeholder="Email" autocomplete="email">
    <input class="auth-input" id="auth-pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="auth-err" id="auth-err"></div>
    <button class="btn btn-primary" id="auth-main-btn">⚡ ENTER THE DARKNESS</button>
    <button class="btn btn-ghost" id="auth-toggle-btn">No account? <span style="color:var(--accent);text-decoration:underline">Create one</span></button>
    <div style="color:var(--muted);font-size:.75rem;margin:2px 0">— or —</div>
    <button class="btn btn-ghost" id="auth-guest-btn">👤 Play as Shadow (Guest)</button>
  </div>
</div>

<!-- GAME CONTAINER -->
<div id="game" class="screen" style="flex-direction:column">
  <div id="topbar">
    <div class="tb-name" id="tb-name">Overlord</div>
    <div class="tb-level" id="tb-level">Lv 1</div>
    <div class="tb-hp" id="tb-hp">
      <div class="tb-hp-fill" id="tb-hp-fill" style="width:100%"></div>
      <div class="tb-hp-txt" id="tb-hp-txt">100/100</div>
    </div>
    <div class="tb-energy"><div class="tb-energy-fill" id="tb-energy-fill" style="width:100%"></div></div>
    <div class="tb-gold">💰<span id="tb-gold">0</span></div>
  </div>

  <!-- inner screens -->
  <div id="world" class="screen active" style="position:relative;top:0;height:calc(100% - var(--hdr) - var(--nav))">
    <div class="idle-bar">
      <span>👹 Army: <span id="idle-army">0</span></span>
      <span>💰 <span id="idle-gps">0.0</span>/sec</span>
    </div>
    <div class="world-scroll" id="zone-grid"></div>
  </div>

  <div id="battle" class="screen" style="position:relative;top:0;height:calc(100% - var(--hdr) - var(--nav))">
    <canvas id="battle-canvas"></canvas>
    <div class="battle-log" id="battle-log"></div>
    <div class="battle-actions">
      <button class="battle-btn btn-attack" id="btn-attack" onclick="playerAction('attack')">⚔️ Attack</button>
      <button class="battle-btn btn-magic" id="btn-magic" onclick="playerAction('magic')">🔮 Dark Magic</button>
      <button class="battle-btn btn-convert" id="btn-convert" onclick="playerAction('convert')">💜 Convert</button>
      <button class="battle-btn btn-flee" id="btn-flee" onclick="playerAction('flee')">🏃 Flee</button>
    </div>
  </div>

  <div id="army" class="screen" style="position:relative;top:0;height:calc(100% - var(--hdr) - var(--nav))">
    <div class="army-header">
      <div>
        <div style="font-size:.85rem;color:var(--gold);font-weight:bold">Your Army</div>
        <div class="army-stats-txt" id="army-stats-txt">0 monsters</div>
      </div>
      <div style="font-size:.75rem;color:var(--green)" id="army-gps-display">+0.0 gold/sec</div>
    </div>
    <div class="army-list" id="army-list"></div>
  </div>

  <div id="inventory" class="screen" style="position:relative;top:0;height:calc(100% - var(--hdr) - var(--nav))">
    <div class="inv-gold-bar">💰 <span id="inv-gold">0</span> &nbsp;|&nbsp; Items: <span id="inv-count">0</span></div>
    <div class="inv-tabs">
      <div class="inv-tab active" onclick="setInvFilter('all',this)">All</div>
      <div class="inv-tab" onclick="setInvFilter('weapon',this)">Weapons</div>
      <div class="inv-tab" onclick="setInvFilter('armor',this)">Armour</div>
      <div class="inv-tab" onclick="setInvFilter('accessory',this)">Accessories</div>
    </div>
    <div class="inv-grid" id="inv-grid"></div>
  </div>

  <div id="rankings" class="screen" style="position:relative;top:0;height:calc(100% - var(--hdr) - var(--nav))">
    <div class="rank-tabs">
      <div class="rank-tab active" onclick="setRankTab('level',this)">🏆 Level</div>
      <div class="rank-tab" onclick="setRankTab('army',this)">⚔️ Army</div>
      <div class="rank-tab" onclick="setRankTab('gold',this)">💰 Gold</div>
    </div>
    <button class="rank-refresh" onclick="loadRankings()">↻ Refresh</button>
    <div class="rank-list" id="rank-list"></div>
  </div>

  <div id="navbar">
    <button class="nav-btn active" id="nav-world" onclick="navTo('world',this)"><span class="nav-icon">🗺️</span>World</button>
    <button class="nav-btn" id="nav-battle" onclick="navTo('battle',this)"><span class="nav-icon">⚔️</span>Battle</button>
    <button class="nav-btn" id="nav-army" onclick="navTo('army',this)"><span class="nav-icon">👹</span>Army</button>
    <button class="nav-btn" id="nav-inventory" onclick="navTo('inventory',this)"><span class="nav-icon">🎒</span>Gear</button>
    <button class="nav-btn" id="nav-rankings" onclick="navTo('rankings',this)"><span class="nav-icon">🏆</span>Rank</button>
  </div>
</div>

function drawSprite(ctx, key, x, y, scale, flipX) {
  const rows = SPR[key] || SPR.goblin;
  ctx.save();
  if (flipX) { ctx.scale(-1,1); x = -x - rows[0].length * scale; }
  rows.forEach((row, ri) => {
    for (let ci = 0; ci < row.length; ci++) {
      const col = PAL[row[ci]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + ci*scale, y + ri*scale, scale, scale);
    }
  });
  ctx.restore();
}

function spriteSize(key) {
  const rows = SPR[key] || SPR.goblin;
  return { w: rows[0].length, h: rows.length };
}

function rollRarity() {
  let r=Math.random()*100, c=0;
  for(let i=0;i<RARITIES.length;i++){c+=RARITY_W[i];if(r<c)return RARITIES[i];}
  return 'common';
}

function generateItem(zoneLevel, forceType) {
  const type=forceType||(['weapon','armor','accessory'][Math.floor(Math.random()*3)]);
  const rarity=rollRarity();
  const mult=RARITY_M[rarity];
  const base=3+zoneLevel*2;
  const suf=type==='weapon'?ITEM_WEP:type==='armor'?ITEM_ARM:ITEM_ACC;
  const name=ITEM_PRE[Math.floor(Math.random()*ITEM_PRE.length)]+' '+suf[Math.floor(Math.random()*suf.length)];
  const icon=type==='weapon'?'⚔️':type==='armor'?'🛡️':'💍';
  const stats={};
  if(type==='weapon'){stats.atk=Math.floor(base*mult*(0.8+Math.random()*0.4));}
  if(type==='armor'){stats.def=Math.floor(base*0.7*mult);stats.hp=Math.floor(base*1.5*mult);}
  if(type==='accessory'){const s=['atk','def','spd','luck'][Math.floor(Math.random()*4)];stats[s]=Math.floor(base*0.5*mult*(0.8+Math.random()*0.4));}
  return{id:'item_'+Date.now()+'_'+Math.random().toString(36).slice(2),name,icon,type,rarity,stats,zoneLevel};
}

// ─── FORMULAS ───
function xpToLevel(lv){return Math.floor(100*Math.pow(1.18,lv-1));}
function calcDmg(atk,def){return Math.max(1,Math.floor(atk*(100/(100+def))*(0.85+Math.random()*0.3)));}
function monsterRarity(lv){return lv>=50?'legendary':lv>=30?'epic':lv>=20?'rare':lv>=10?'uncommon':'common';}
function equipBonus(stat){
  return Object.values(gs.player.equipment).reduce((s,it)=>s+(it&&it.stats&&it.stats[stat]?it.stats[stat]:0),0);
}

function createEnemy(zoneId,isBoss){
  const zone=ZONES.find(z=>z.id===zoneId);
  const lv=isBoss?zone.level+5:zone.level+Math.floor(Math.random()*5);
  if(isBoss){
    const b=zone.boss;
    const hp=Math.floor((80+lv*30)*5);
    return{name:b.name,type:b.type,level:lv,hp,maxHp:hp,
      atk:Math.floor((8+lv*5)*2.2),def:Math.floor((3+lv*2)*2),isBoss:true};
  }
  const type=zone.monsters[Math.floor(Math.random()*zone.monsters.length)];
  const hp=Math.floor(30+lv*20+Math.random()*15);
  const atk=Math.floor(8+lv*4+Math.random()*4);
  const def=Math.floor(3+lv*2);

  const name=names[Math.floor(Math.random()*names.length)];

}

// ─── IDLE ───
function calcGPS(m){
  if(!m.assignment)return 0;
  const zone=ZONES.find(z=>z.id===m.assignment);
  if(!zone)return 0;
  return zone.goldPK*0.2*(1+m.level*0.05);
}
function totalGPS(){return gs.army.reduce((s,m)=>s+calcGPS(m),0);}

function tickIdle(){
  const now=Date.now();
  const dt=Math.min((now-lastTick)/1000,30);
  lastTick=now;
  if(dt<=0)return;
  let dirty=false;
  gs.army.forEach(m=>{
    if(!m.assignment)return;
    const zone=ZONES.find(z=>z.id===m.assignment);
    if(!zone)return;
    gs.player.gold+=calcGPS(m)*dt;
    m.xp+=(zone.xpPK*0.3*(1+m.level*0.03))*dt;
    if(m.xp>=xpToLevel(m.level)){
      m.xp-=xpToLevel(m.level);m.level++;
      m.maxHp=Math.floor(m.maxHp*1.08);m.hp=m.maxHp;
      m.stats.atk=Math.floor(m.stats.atk*1.06);
      m.stats.def=Math.floor(m.stats.def*1.06);
      toast(`${m.name} is now Level ${m.level}!`);
      checkEvo(m);dirty=true;
    }
  });
  gs.player.energy=Math.min(gs.player.maxEnergy,gs.player.energy+dt*1.5);
  gs.player.gold=Math.floor(gs.player.gold*10)/10;
  if(dirty)saveGame();
  updateTopBar();
  updateIdleBar();
  if(currentScreen==='army')renderArmyList();
}

function calcOfflineGains(){
  const elapsed=Math.min((Date.now()-gs.lastSave)/1000,28800);
  if(elapsed<60)return null;
  let gold=0;const details=[];
  gs.army.forEach(m=>{
    if(!m.assignment)return;
    const zone=ZONES.find(z=>z.id===m.assignment);
    if(!zone)return;
    const g=calcGPS(m)*elapsed;gold+=g;
    if(g>0.5)details.push({name:m.name,gold:Math.floor(g)});
  });
  if(gold<1)return null;
  gs.player.gold+=gold;
  return{gold:Math.floor(gold),time:Math.floor(elapsed/60),details};
}

function checkEvo(m){
  const thr=Math.floor(m.level/10)*10;
  if(thr<10)return;
  const key=`${m.evolvedFrom[0]}_${thr}`;
  if(EVOLUTIONS[key]&&!m[`evo${thr}`]){m.pendingEvo=thr;renderArmyList();}
}

// ─── BATTLE ───
function startBattle(zoneId,isBoss){
  const zone=ZONES.find(z=>z.id===zoneId);
  gs.player.currentZone=zoneId;
  battleState={
    zone,isBoss,enemy:createEnemy(zoneId,isBoss),
    animating:false,over:false,
    enemyHitFlash:0,playerHitFlash:0,shake:0
  };
  particles=[];
  document.getElementById('battle-log').innerHTML='';
  addLog(`A ${battleState.enemy.name} appears!`,'good');
  navTo('battle',document.getElementById('nav-battle'));
  updateBattleUI();
  if(battleAnimId)cancelAnimationFrame(battleAnimId);
  battleFrame=0;
  battleLoop();
}

function battleLoop(){
  const canvas=document.getElementById('battle-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    ctx.scale(dpr,dpr);
  }
  ctx.clearRect(0,0,w,h);
  if(battleState)renderBattleScene(ctx,w,h);
  renderParticles(ctx);
  battleFrame++;
  battleAnimId=requestAnimationFrame(battleLoop);
}

function renderBattleScene(ctx,w,h){
  const bs=battleState;
  // Background
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,bs.zone.bg1);grad.addColorStop(1,bs.zone.bg2);
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  drawBiomeEnv(ctx,w,h,bs.zone.biome);

  // Shake
  let sx=0,sy=0;
  if(bs.shake>0){sx=(Math.random()-.5)*bs.shake*3;sy=(Math.random()-.5)*bs.shake*1.5;bs.shake=Math.max(0,bs.shake-.5);ctx.translate(sx,sy);}

  // Player
  const pKey='overlord';
  const pSz=spriteSize(pKey);
  const pSc=Math.max(2,Math.floor(Math.min(w*0.16/pSz.w,(h*0.38)/pSz.h)));
  const pW=pSz.w*pSc,pH=pSz.h*pSc;
  const pX=Math.floor(w*0.17),pY=Math.floor(h*0.55)+Math.round(Math.sin(battleFrame*0.03)*3);
  if(bs.playerHitFlash>0){ctx.globalAlpha=0.4+0.6*(1-bs.playerHitFlash);bs.playerHitFlash=Math.max(0,bs.playerHitFlash-.1);}
  drawSprite(ctx,pKey,pX-Math.floor(pW/2),pY-pH,pSc,false);
  ctx.globalAlpha=1;

  // Enemy
  const eKey=bs.enemy.type in SPR?bs.enemy.type:'goblin';
  const eSz=spriteSize(eKey);
  const eSc=bs.isBoss?Math.max(2,Math.floor(Math.min(w*0.26/eSz.w,(h*0.5)/eSz.h))):Math.max(2,Math.floor(Math.min(w*0.18/eSz.w,(h*0.4)/eSz.h)));
  const eW=eSz.w*eSc,eH=eSz.h*eSc;
  const eX=Math.floor(w*0.76),eY=Math.floor(h*0.55)+Math.round(Math.sin(battleFrame*0.025+1)*3);
  if(bs.enemyHitFlash>0){ctx.globalAlpha=0.35+0.65*(1-bs.enemyHitFlash);bs.enemyHitFlash=Math.max(0,bs.enemyHitFlash-.1);}
  drawSprite(ctx,eKey,eX-Math.floor(eW/2),eY-eH,eSc,true);
  ctx.globalAlpha=1;

  if(bs.shake>0)ctx.translate(-sx,-sy);

  // HP bars
  drawHPBar(ctx,pX,pY-pH-16,88,gs.player.hp,gs.player.maxHp,'You','#33cc66');
  drawHPBar(ctx,eX,eY-eH-16,88,bs.enemy.hp,bs.enemy.maxHp,bs.enemy.name.split(' ')[0].substring(0,8),'#ff4444');
  // Energy bar
  const ex=pX-44,ey=pY-pH-7;
  ctx.fillStyle='#0a0a2a';ctx.fillRect(ex,ey,88,5);
  ctx.fillStyle='#6600cc';ctx.fillRect(ex,ey,88*(gs.player.energy/gs.player.maxEnergy),5);
}

function drawBiomeEnv(ctx,w,h,biome){
  ctx.save();ctx.globalAlpha=0.25;
  if(biome==='forest'){
    ctx.fillStyle='#1a4a1a';
    for(let i=0;i<6;i++){const tx=i*w/5;ctx.beginPath();ctx.moveTo(tx,h*0.85);ctx.lineTo(tx-18,h);ctx.lineTo(tx+18,h);ctx.fill();ctx.beginPath();ctx.moveTo(tx,h*0.7);ctx.lineTo(tx-14,h*0.88);ctx.lineTo(tx+14,h*0.88);ctx.fill();}
  }else if(biome==='cave'){
    ctx.fillStyle='#334';
    for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(i*w/7,0);ctx.lineTo(i*w/7+12,h*0.12);ctx.lineTo(i*w/7+24,0);ctx.fill();}
    ctx.fillStyle='#223';
    for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(i*w/6,h);ctx.lineTo(i*w/6+16,h*0.82);ctx.lineTo(i*w/6+32,h);ctx.fill();}
  }else if(biome==='volcano'){
    ctx.globalAlpha=0.18;ctx.fillStyle='#ff4400';ctx.fillRect(0,h*0.82,w,h*0.18);
    ctx.globalAlpha=0.22;ctx.fillStyle='#ff8800';
    for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(i*w/4+20,h*0.86+Math.sin(battleFrame*.05+i)*4,14+i*4,0,Math.PI*2);ctx.fill();}
  }else if(biome==='frozen'){
    ctx.fillStyle='#aaccff';ctx.globalAlpha=0.1;
    for(let i=0;i<25;i++){ctx.fillRect((i*67+battleFrame*.3)%w,(i*43)%h,2,8);}
  }else if(biome==='shadow'){
    ctx.fillStyle='#8800ff';ctx.globalAlpha=0.07;
    for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(i*w/8+10,h*.5+Math.sin(battleFrame*.02+i)*25,25+i*4,0,Math.PI*2);ctx.fill();}
  }else if(biome==='sky'){
    ctx.fillStyle='#ffffff';ctx.globalAlpha=0.1;
    for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(i*w/3+50,(i%2)*h*.3+30,60+i*20,20,0,0,Math.PI*2);ctx.fill();}
  }
  ctx.globalAlpha=1;ctx.restore();
}

function drawHPBar(ctx,cx,y,width,hp,maxHp,label,color){
  const x=cx-width/2;
  ctx.fillStyle='#0a0a0a';ctx.fillRect(x,y,width,8);
  ctx.fillStyle=color;ctx.fillRect(x,y,Math.max(0,width*(hp/maxHp)),8);
  ctx.strokeStyle='#33333366';ctx.lineWidth=1;ctx.strokeRect(x,y,width,8);
  ctx.fillStyle='#ddd';ctx.font='bold 8px Arial';ctx.textAlign='center';
  ctx.fillText(label,cx,y-3);
}

function renderParticles(ctx){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  });
  ctx.globalAlpha=1;
}

function spawnFX(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:25+Math.random()*20,maxLife:45,color,size:2+Math.random()*4});
  }
}

function addLog(msg,cls=''){
  const log=document.getElementById('battle-log');
  const p=document.createElement('p');
  if(cls)p.className=cls;p.textContent=msg;
  log.appendChild(p);log.scrollTop=log.scrollHeight;
  while(log.children.length>12)log.removeChild(log.firstChild);
}

function updateBattleUI(){
  if(!battleState)return;
  const bs=battleState;
  const canConvert=!bs.over&&!bs.animating&&!bs.isBoss&&(bs.enemy.hp/bs.enemy.maxHp)<0.3;
  document.getElementById('btn-convert').classList.toggle('ready',canConvert);
  const over=bs.over||bs.animating;
  document.getElementById('btn-attack').disabled=over;
  document.getElementById('btn-flee').disabled=over;
  document.getElementById('btn-convert').disabled=over||!canConvert||bs.isBoss;
  document.getElementById('btn-magic').disabled=over||gs.player.energy<15;
  updateTopBar();
}

function playerAction(action){
  if(!battleState||battleState.over||battleState.animating)return;
  const bs=battleState;
  const c=document.getElementById('battle-canvas');
  const ex=c.clientWidth*.76,ey=c.clientHeight*.45;
  const px=c.clientWidth*.17,py=c.clientHeight*.45;
  bs.animating=true;

  if(action==='attack'){
    const dmg=calcDmg(gs.player.stats.atk+equipBonus('atk'),bs.enemy.def);
    bs.enemy.hp=Math.max(0,bs.enemy.hp-dmg);
    bs.enemyHitFlash=1;bs.shake=2;
    spawnFX(ex,ey,'#ff4444',8);
    addLog(`You strike for ${dmg} damage!`,'player');
  }else if(action==='magic'){
    if(gs.player.energy<15){bs.animating=false;return;}
    gs.player.energy-=15;
    const dmg=Math.floor(calcDmg(gs.player.stats.atk+equipBonus('atk'),bs.enemy.def)*1.85);
    bs.enemy.hp=Math.max(0,bs.enemy.hp-dmg);
    bs.enemyHitFlash=1;
    spawnFX(ex,ey,'#8800ff',16);
    addLog(`Dark Magic surges! ${dmg} damage!`,'player');
  }else if(action==='convert'){
    const pct=bs.enemy.hp/bs.enemy.maxHp;
    const chance=Math.min(0.9,(gs.player.stats.charisma/80)*(1-pct)*2.5);
    if(Math.random()<chance){
      spawnFX(ex,ey,'#ff00ff',28);
      addLog(`${bs.enemy.name} surrenders to your will!`,'convert');
      bs.animating=false;
      setTimeout(()=>endBattle(true),900);return;
    }else{
      spawnFX(ex,ey,'#ff88ff',6);
      addLog(`${bs.enemy.name} resists conversion!`,'hit');
    }
  }else if(action==='flee'){
    if(Math.random()<0.55){
      addLog('You flee into the shadows!','good');bs.animating=false;bs.over=true;
      setTimeout(()=>navTo('world',document.getElementById('nav-world')),500);return;
    }else{addLog('Failed to flee!','hit');}
  }

  if(bs.enemy.hp<=0){bs.animating=false;setTimeout(()=>endBattle(false),600);return;}
  setTimeout(enemyTurn,750);
}

function enemyTurn(){
  const bs=battleState;if(!bs||bs.over)return;
  const def=gs.player.stats.def+equipBonus('def');
  const dmg=calcDmg(bs.enemy.atk,def);
  gs.player.hp=Math.max(0,gs.player.hp-dmg);
  bs.playerHitFlash=1;bs.shake=3;
  const c=document.getElementById('battle-canvas');
  spawnFX(c.clientWidth*.17,c.clientHeight*.45,'#ff3333',6);
  addLog(`${bs.enemy.name} hits you for ${dmg}!`,'hit');
  updateTopBar();
  if(gs.player.hp<=0){
    addLog('Defeated... but the Overlord cannot die permanently.','hit');
    gs.player.hp=Math.floor(gs.player.maxHp*0.35);
    gs.player.gold=Math.max(0,gs.player.gold-Math.floor(gs.player.gold*0.05));
    bs.over=true;
    setTimeout(()=>{navTo('world',document.getElementById('nav-world'));updateTopBar();},1500);
    return;
  }
  bs.animating=false;updateBattleUI();
}

function endBattle(converted){
  const bs=battleState;bs.over=true;
  if(converted){
    const m=createArmyMonster(bs.enemy);
    gs.army.push(m);gs.player.totalConverts++;
    addLog(`${bs.enemy.name} joins your army!`,'convert');
    toast(`${m.name} joins your dark army! 👹`);
    checkEvo(m);
  }else{
    const zone=bs.zone;
    const xpG=Math.floor(zone.xpPK*(1+bs.enemy.level*0.1)*(bs.isBoss?8:1));
    const goldG=Math.floor(zone.goldPK*(1+bs.enemy.level*0.05)*(bs.isBoss?5:1)*(0.8+Math.random()*0.4));
    gs.player.xp+=xpG;gs.player.gold+=goldG;gs.player.totalKills++;
    if(gs.zones[zone.id])gs.zones[zone.id].kills=(gs.zones[zone.id].kills||0)+1;
    if(bs.isBoss){gs.zones[zone.id].bossKilled=true;unlockNextZone(zone.id);toast(`${bs.enemy.name} defeated! New zone unlocked! 🗺️`);}
    while(gs.player.xp>=xpToLevel(gs.player.level)){
      gs.player.xp-=xpToLevel(gs.player.level);gs.player.level++;
      gs.player.maxHp=Math.floor(gs.player.maxHp*1.06+10);gs.player.hp=gs.player.maxHp;
      gs.player.stats.atk=Math.floor(gs.player.stats.atk*1.05+2);
      gs.player.stats.def=Math.floor(gs.player.stats.def*1.05+1);
      gs.player.stats.charisma=Math.floor(gs.player.stats.charisma*1.03+1);
      toast(`Level Up! Now Level ${gs.player.level}! ✨`);
    }
    addLog(`Victory! +${xpG} XP, +${goldG} gold`,'good');
    if(Math.random()<0.18+gs.player.stats.luck*0.005){
      const item=generateItem(zone.level);gs.inventory.push(item);
      addLog(`Loot: ${item.icon} ${item.name} (${item.rarity})!`,'good');
      toast(`Loot: ${item.icon} ${item.name}!`);
    }
  }
  saveGame();updateTopBar();
  setTimeout(()=>{navTo('world',document.getElementById('nav-world'));renderWorldMap();},1000);
}

function unlockNextZone(clearedId){
  const next=ZONES.find(z=>z.unlocksAfter===clearedId);
  if(!next)return;
  if(!gs.zones[next.id])gs.zones[next.id]={kills:0,bossKilled:false,unlocked:false};
  gs.zones[next.id].unlocked=true;
}

// ─── UI ───
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function navTo(id,btn){
  currentScreen=id;
  ['world','battle','army','inventory','rankings'].forEach(s=>{
    const el=document.getElementById(s);if(el)el.classList.toggle('active',s===id);
  });
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(id==='world')renderWorldMap();
  else if(id==='army')renderArmyList();
  else if(id==='inventory')renderInventory();
  else if(id==='rankings')loadRankings();
}

function updateTopBar(){
  const p=gs.player;
  document.getElementById('tb-name').textContent=p.name.substring(0,12);
  document.getElementById('tb-level').textContent=`Lv ${p.level}`;
  const hp=Math.max(0,Math.min(100,(p.hp/p.maxHp)*100));
  document.getElementById('tb-hp-fill').style.width=hp+'%';
  document.getElementById('tb-hp-txt').textContent=`${Math.ceil(p.hp)}/${p.maxHp}`;
  document.getElementById('tb-energy-fill').style.width=((p.energy/p.maxEnergy)*100)+'%';
  document.getElementById('tb-gold').textContent=Math.floor(p.gold).toLocaleString();
}

function updateIdleBar(){
  document.getElementById('idle-army').textContent=gs.army.length;
  document.getElementById('idle-gps').textContent=totalGPS().toFixed(1);
}

function renderWorldMap(){
  const grid=document.getElementById('zone-grid');grid.innerHTML='';
  ZONES.forEach(zone=>{
    const zs=gs.zones[zone.id]||{kills:0,bossKilled:false,unlocked:false};
    const unlocked=zs.unlocked,kills=zs.kills||0;
    const bossReady=kills>=100&&!zs.bossKilled,bossDefeated=zs.bossKilled;
    const assigned=gs.army.filter(m=>m.assignment===zone.id).length;
    const onlineHere=Object.values(onlinePlayers).filter(p=>p.zone===zone.id).length;
    const card=document.createElement('div');
    card.className='zone-card'+(unlocked?'':' locked');
    card.innerHTML=`
      <div class="zone-header" style="background:linear-gradient(135deg,${zone.bg2},${zone.col})">
        <div class="zone-name">${zone.name}</div>
        ${onlineHere>0?`<div style="position:absolute;top:4px;right:4px;background:#00cc66;border-radius:8px;padding:2px 5px;font-size:.6rem;color:#fff">👁 ${onlineHere}</div>`:''}
      </div>
      <div class="zone-body">
        <div class="zone-kills"><span>Kills: ${kills}/100</span><span>${bossDefeated?'✅ Boss':'⚔️ Lv '+zone.level}</span></div>
        <div class="zone-progress"><div class="zone-progress-fill" style="width:${Math.min(100,(kills/100)*100)}%"></div></div>
        ${assigned>0?`<div class="zone-assigned">⚔️ ${assigned} farming</div>`:''}
        <div class="zone-btns">
          ${unlocked?`<button class="zone-enter" onclick="startBattle('${zone.id}',false)">⚔️ Enter</button>`:`<div class="zone-locked-msg">🔒 Defeat prev boss</div>`}
          ${bossReady?`<button class="zone-boss" onclick="startBattle('${zone.id}',true)">💀 BOSS</button>`:''}
        </div>
      </div>`;
    grid.appendChild(card);
  });
  updateIdleBar();
}

function renderArmyList(){
  const list=document.getElementById('army-list');
  const asgn=gs.army.filter(m=>m.assignment).length;
  document.getElementById('army-stats-txt').textContent=`${gs.army.length} monsters · ${asgn} assigned`;
  document.getElementById('army-gps-display').textContent=`+${totalGPS().toFixed(1)} gold/sec`;
  if(gs.army.length===0){
    list.innerHTML='<div class="empty-army"><div style="font-size:2.5rem">👹</div><div>No monsters yet.<br>Convert enemies in battle!</div></div>';return;
  }
  list.innerHTML='';
  gs.army.forEach(m=>{
    const xpPct=Math.min(100,(m.xp/xpToLevel(m.level))*100);
    const eKey=m.type in SPR?m.type:'goblin';
    const card=document.createElement('div');
    card.className=`monster-card rarity-${m.rarity}`;
    card.innerHTML=`
      <div class="mc-top">
        <div class="mc-sprite"><canvas id="spr-${m.id}" width="48" height="48"></canvas></div>
        <div class="mc-info">
          <div style="display:flex;align-items:center;gap:6px">
            <div class="mc-name">${m.name}</div>
            <div class="mc-lvl">Lv ${m.level}</div>
          </div>
          <div class="mc-type">${m.type.replace(/_/g,' ')}</div>
          <div class="mc-xpbar"><div class="mc-xpbar-fill" style="width:${xpPct}%"></div></div>
        </div>
      </div>
      <div class="mc-bottom">
        <button class="mc-assign-btn" onclick="openAssignModal('${m.id}')">${m.assignment?'📍 '+m.assignment:'📍 Assign Zone'}</button>
        <button class="mc-equip-btn" onclick="openMonsterEquip('${m.id}')">🎒</button>
        ${m.pendingEvo?`<span class="evo-badge" onclick="openEvoModal('${m.id}')">✨ EVOLVE</span>`:''}
      </div>`;
    list.appendChild(card);
    requestAnimationFrame(()=>{
      const c=document.getElementById(`spr-${m.id}`);if(!c)return;
      const ctx=c.getContext('2d');ctx.clearRect(0,0,48,48);
      const sz=spriteSize(eKey);
      const sc=Math.max(1,Math.floor(Math.min(44/sz.w,44/sz.h)));
      drawSprite(ctx,eKey,Math.floor((48-sz.w*sc)/2),Math.floor((48-sz.h*sc)/2),sc,false);
    });
  });
}

function renderInventory(){
  document.getElementById('inv-gold').textContent=Math.floor(gs.player.gold).toLocaleString();
  document.getElementById('inv-count').textContent=gs.inventory.length;
  const grid=document.getElementById('inv-grid');
  const items=invFilter==='all'?gs.inventory:gs.inventory.filter(i=>i.type===invFilter);
  if(items.length===0){grid.innerHTML='<div class="inv-empty">No items yet.<br>Defeat monsters to find gear!</div>';return;}
  grid.innerHTML='';
  items.forEach(item=>{
    const statStr=Object.entries(item.stats).map(([k,v])=>`+${v} ${k}`).join(' ');
    const card=document.createElement('div');
    card.className=`item-card ${item.rarity}`;
    card.innerHTML=`<div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div><div class="item-stats">${statStr}</div><div class="item-rarity ${item.rarity}">${item.rarity.toUpperCase()}</div>`;
    card.onclick=()=>openItemModal(item.id);
    grid.appendChild(card);
  });
}

// ─── MODALS ───
function openModal(title,html){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModalOverlay(e){
  if(e.target===document.getElementById('modal-overlay'))document.getElementById('modal-overlay').classList.remove('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

function openAssignModal(mId){
  const m=gs.army.find(x=>x.id===mId);if(!m)return;
  const unlocked=ZONES.filter(z=>gs.zones[z.id]&&gs.zones[z.id].unlocked);
  let html='<div class="assign-zones">';
  if(m.assignment)html+=`<div class="assign-zone-row" style="border-color:#cc0000;color:#ff6666" onclick="assignMonster('${mId}',null)">❌ Unassign (make idle)</div>`;
  unlocked.forEach(z=>{
    const active=m.assignment===z.id;
    html+=`<div class="assign-zone-row" style="${active?'border-color:var(--accent);color:#cc88ff':''}" onclick="assignMonster('${mId}','${z.id}')"><span>${z.name}</span><span style="font-size:.7rem;color:var(--muted)">Lv ${z.level} · ${(z.goldPK*0.2).toFixed(1)} gold/s/lv</span></div>`;
  });
  html+='</div>';
  openModal(`Assign ${m.name}`,html);
}

function assignMonster(mId,zoneId){
  const m=gs.army.find(x=>x.id===mId);if(!m)return;
  m.assignment=zoneId;closeModal();
  toast(zoneId?`${m.name} assigned to ${zoneId}!`:`${m.name} is now idle`);
  renderArmyList();saveGame();
}

function openEvoModal(mId){
  const m=gs.army.find(x=>x.id===mId);if(!m)return;
  const key=`${m.evolvedFrom[0]}_${m.pendingEvo}`;
  const opts=EVOLUTIONS[key];if(!opts)return;
  let html='<div class="evo-options">';
  opts.forEach(opt=>{
    html+=`<div class="evo-opt" onclick="evolveMonster('${mId}','${opt.type}',${m.pendingEvo})">
      <div class="evo-opt-name">${opt.name}</div>
      <div class="evo-opt-desc">${opt.desc}</div>
      <div class="evo-opt-stats">ATK +${opt.atkB} · DEF +${opt.defB} · SPD +${opt.spdB}</div>
    </div>`;
  });
  html+='</div>';
  openModal(`${m.name} can evolve!`,html);
}

function evolveMonster(mId,newType,thr){
  const m=gs.army.find(x=>x.id===mId);if(!m)return;
  const key=`${m.evolvedFrom[0]}_${thr}`;
  const opt=(EVOLUTIONS[key]||[]).find(o=>o.type===newType);if(!opt)return;
  m.type=newType;m.stats.atk+=opt.atkB;m.stats.def+=opt.defB;m.stats.spd+=opt.spdB;
  m.pendingEvo=false;m[`evo${thr}`]=true;
  m.maxHp=Math.floor(m.maxHp*1.2);m.hp=m.maxHp;
  closeModal();toast(`${m.name} evolved into ${opt.name}! ✨`);
  renderArmyList();saveGame();
}

function openItemModal(itemId){
  const item=gs.inventory.find(i=>i.id===itemId);if(!item)return;
  const statStr=Object.entries(item.stats).map(([k,v])=>`+${v} ${k.toUpperCase()}`).join(', ');
  const sellVal=Math.max(1,Math.floor(Object.values(item.stats).reduce((s,v)=>s+v,0)*RARITY_SELL[item.rarity]));
  openModal(item.name,`
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:2.5rem">${item.icon}</div>
      <div class="item-rarity ${item.rarity}" style="font-size:.8rem;margin:6px 0">${item.rarity.toUpperCase()}</div>
      <div style="font-size:.82rem;color:var(--accent)">${statStr}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-primary" onclick="equipToPlayer('${itemId}')">⚔️ Equip to yourself</button>
      <button class="btn btn-ghost" style="border-color:#cc4400;color:#ff8844" onclick="sellItem('${itemId}',${sellVal})">💰 Sell for ${sellVal} gold</button>
    </div>`);
}

function equipToPlayer(itemId){
  const item=gs.inventory.find(i=>i.id===itemId);if(!item)return;
  const prev=gs.player.equipment[item.type];
  if(prev)gs.inventory.push(prev);
  gs.player.equipment[item.type]=item;
  gs.inventory=gs.inventory.filter(i=>i.id!==itemId);
  closeModal();toast(`${item.name} equipped!`);renderInventory();saveGame();
}

function sellItem(itemId,val){
  gs.inventory=gs.inventory.filter(i=>i.id!==itemId);
  gs.player.gold+=val;closeModal();toast(`Sold for ${val} gold! 💰`);
  renderInventory();updateTopBar();saveGame();
}

function openMonsterEquip(mId){
  const m=gs.army.find(x=>x.id===mId);if(!m)return;
  if(!gs.inventory.length){toast('No items in inventory!');return;}
  let html='<div class="assign-zones">';
  gs.inventory.forEach(item=>{
    const stat=Object.entries(item.stats).map(([k,v])=>`+${v} ${k}`).join(' ');
    html+=`<div class="assign-zone-row" onclick="equipToMonster('${mId}','${item.id}')">${item.icon} ${item.name} <span style="font-size:.7rem;color:var(--muted)">${stat}</span></div>`;
  });
  html+='</div>';
  openModal(`Equip ${m.name}`,html);
}

function equipToMonster(mId,itemId){
  const m=gs.army.find(x=>x.id===mId);const item=gs.inventory.find(i=>i.id===itemId);if(!m||!item)return;
  const prev=m.equipment[item.type];if(prev)gs.inventory.push(prev);
  m.equipment[item.type]=item;gs.inventory=gs.inventory.filter(i=>i.id!==itemId);
  closeModal();toast(`${item.name} equipped to ${m.name}!`);renderArmyList();saveGame();
}

// ─── RANKINGS ───
let rankData=[];
async function loadRankings(){
  const list=document.getElementById('rank-list');
  list.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">Loading...</div>';
  if(FB_ON&&fireDb){
    try{
      const field=rankTab==='level'?'level':rankTab==='army'?'armySize':'gold';
      const snap=await fireDb.collection('players').orderBy(field,'desc').limit(50).get();
      rankData=snap.docs.map(d=>d.data());
    }catch(e){rankData=genFakeRankings();}
  }else{rankData=genFakeRankings();}
  const myUid=currentUser?.uid||'local';
  if(!rankData.find(r=>r.uid===myUid||r.name===gs.player.name)){
    rankData.push({name:gs.player.name,level:gs.player.level,armySize:gs.army.length,gold:Math.floor(gs.player.gold),uid:myUid});
  }
  const field=rankTab==='level'?'level':rankTab==='army'?'armySize':'gold';
  rankData.sort((a,b)=>b[field]-a[field]);
  renderRankList();
}

function renderRankList(){
  const list=document.getElementById('rank-list');list.innerHTML='';
  const myUid=currentUser?.uid||'local';
  const field=rankTab==='level'?'level':rankTab==='army'?'armySize':'gold';
  rankData.slice(0,50).forEach((p,i)=>{
    const isMe=p.uid===myUid||p.name===gs.player.name;
    const row=document.createElement('div');
    row.className='rank-row'+(isMe?' me':'');
    let nc='rank-num'+(i===0?' gold-r':i===1?' silver-r':i===2?' bronze-r':'');
    const val=field==='gold'?Math.floor(p[field]||0).toLocaleString():(p[field]||0);
    const label=field==='level'?`Lv ${val}`:field==='army'?`${val} 👹`:`${val} 💰`;
    row.innerHTML=`<div class="${nc}">${i+1}</div><div class="rank-name">${p.name}${isMe?' (you)':''}</div><div class="rank-val">${label}</div>`;
    list.appendChild(row);
  });
}

function setRankTab(tab,el){
  rankTab=tab;document.querySelectorAll('.rank-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');loadRankings();
}

function setInvFilter(filter,el){
  invFilter=filter;document.querySelectorAll('.inv-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderInventory();
}

const FAKE_NAMES=['ShadowReaper','VoidLord','NightBane','CursedKing','DarkMage','GrimSoul','ObsidianLord',
  'NecroKing','PhantomEdge','ChaosLord','BloodMoon','AshCrown','VoidWalker','SoulRipper','DarkHarbinger',
  'GraveWarden','NightStalker','HexMaster','AbyssLord','DoomBringer','ShadowKnight','BoneCrown','GrimReaper',
  'VoidEater','CurseMaster','DarkShroud','NightRaider','PhantomWolf','SoulBinder','HexLord'];

function genFakeRankings(){
  return FAKE_NAMES.map((name,i)=>({
    name,uid:'fake_'+i,
    level:Math.max(1,180-i*5+Math.floor(Math.random()*10)),
    armySize:Math.floor(Math.random()*60)+2,
    gold:Math.floor(Math.random()*500000)
  }));
}

// ─── TOAST ───
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

// ─── AUTH BACKGROUND CANVAS ───
function initAuthBG(){
  const canvas=document.getElementById('auth-bg');if(!canvas)return;
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  const pts=Array.from({length:55},()=>({
    x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,
    vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
    size:1+Math.random()*2,alpha:.1+Math.random()*.5,
    col:['#8b00ff','#ffd700','#ff3333','#4488ff'][Math.floor(Math.random()*4)]
  }));
  function frame(){
    if(!document.getElementById('auth').classList.contains('active')){requestAnimationFrame(frame);return;}
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p=>{
      p.x=(p.x+p.vx+canvas.width)%canvas.width;p.y=(p.y+p.vy+canvas.height)%canvas.height;
      ctx.globalAlpha=p.alpha;ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;requestAnimationFrame(frame);
  }
  frame();
}

// ─── AUTH ───
let authMode='login';
function setupAuth(){
  document.getElementById('auth-toggle-btn').onclick=()=>{
    authMode=authMode==='login'?'register':'login';
    const reg=authMode==='register';
    document.getElementById('auth-name').style.display=reg?'block':'none';
    document.getElementById('auth-main-btn').textContent=reg?'⚔️ RISE AS OVERLORD':'⚡ ENTER THE DARKNESS';
    document.getElementById('auth-toggle-btn').innerHTML=reg?'Have account? <span style="color:var(--accent);text-decoration:underline">Sign in</span>':'No account? <span style="color:var(--accent);text-decoration:underline">Create one</span>';
  };
  document.getElementById('auth-main-btn').onclick=async()=>{
    const email=document.getElementById('auth-email').value.trim();
    const pass=document.getElementById('auth-pass').value;
    const errEl=document.getElementById('auth-err');errEl.textContent='';
    if(!email||!pass){errEl.textContent='Please enter email and password.';return;}
    if(!FB_ON){
      gs=DEFAULT_STATE();
      if(authMode==='register')gs.player.name=document.getElementById('auth-name').value.trim()||'Dark Overlord';
      startGame();return;
    }
    const btn=document.getElementById('auth-main-btn');btn.disabled=true;btn.textContent='...';
    try{
      if(authMode==='login'){await firebase.auth().signInWithEmailAndPassword(email,pass);}
      else{
        await firebase.auth().createUserWithEmailAndPassword(email,pass);
        gs.player.name=document.getElementById('auth-name').value.trim()||'Dark Overlord';
      }
    }catch(e){
      errEl.textContent=e.message.replace('Firebase: ','').replace(/\(auth.*?\)/,'');
      btn.disabled=false;btn.textContent=authMode==='login'?'⚡ ENTER THE DARKNESS':'⚔️ RISE AS OVERLORD';
    }
  };
  document.getElementById('auth-guest-btn').onclick=async()=>{
    if(!FB_ON){gs=DEFAULT_STATE();startGame();return;}
    try{await firebase.auth().signInAnonymously();}catch(e){gs=DEFAULT_STATE();startGame();}
  };
}

// ─── PRESENCE ───
function initPresence(){
  if(!fireRtdb||!currentUser)return;
  const ref=fireRtdb.ref(`presence/${currentUser.uid}`);
  ref.set({name:gs.player.name,level:gs.player.level,zone:gs.player.currentZone,t:firebase.database.ServerValue.TIMESTAMP});
  ref.onDisconnect().remove();
  fireRtdb.ref('presence').on('value',snap=>{
    onlinePlayers=snap.val()||{};
    if(currentScreen==='world')renderWorldMap();
  });
}

function startGame(){
  lastTick=Date.now();
  showScreen('game');
  navTo('world',document.getElementById('nav-world'));
  updateTopBar();renderWorldMap();
  const gains=calcOfflineGains();
  if(gains){
    setTimeout(()=>{
      let html='<div class="gains-popup"><div class="gains-title">⏰ Welcome Back!</div>';
      html+=`<div style="color:var(--muted);font-size:.78rem;margin-bottom:10px">Away for ${gains.time} minutes</div>`;
      html+='<div class="gains-rows">';
      gains.details.slice(0,5).forEach(d=>{html+=`<div class="gains-row"><span>${d.name}</span><span>+${d.gold} gold</span></div>`;});
      html+=`</div><div style="color:var(--gold);font-size:1rem;font-weight:bold;margin:8px 0">Total: +${gains.gold} gold</div>`;
      html+=`<button class="btn btn-primary" onclick="closeModal()">✨ Claim</button></div>`;
      openModal('Offline Gains',html);updateTopBar();saveGame();
    },800);
  }
  if(idleInterval)clearInterval(idleInterval);
  idleInterval=setInterval(tickIdle,1500);
  if(FB_ON&&currentUser)initPresence();
}

// ─── INIT ───
document.addEventListener('DOMContentLoaded',()=>{
  showScreen('loading');setupAuth();initAuthBG();
  if(FB_ON){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      fireDb=firebase.firestore();fireRtdb=firebase.database();
      firebase.auth().onAuthStateChanged(async user=>{
        if(user){currentUser=user;await loadGame();startGame();}
        else{setTimeout(()=>showScreen('auth'),1200);}
      });
    }catch(e){console.warn('Firebase error, going offline:',e);localStart();}
  }else{localStart();}
});

function localStart(){
  setTimeout(()=>{
    const s=localStorage.getItem('darkOverlord_v2');
    if(s){try{gs=JSON.parse(s);startGame();}catch(e){gs=DEFAULT_STATE();showScreen('auth');}}
    else{showScreen('auth');}
  },1400);
}
</script>
